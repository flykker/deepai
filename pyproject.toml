[project]
name = "deepai-agent"
version = "0.1.0"
description = "Deep agent (langgraph + deepagents) with Claude Code-style background tasks"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<0.8",
    "langgraph>=1.2,<1.3",
    "langchain>=1.4,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
deepai-agent = "agent.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.background", "evals", "evals.scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
